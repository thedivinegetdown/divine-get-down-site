<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO (per-tab SEO is handled in React via Helmet) -->
    <title>The Divine Get Down — Receive Stillness</title>
    <meta name="robots" content="index,follow" />
    <meta
      name="description"
      content="A fast, modern sanctuary to watch faith-filled videos, find stillness, and subscribe for weekly encouragement."
    />
    <meta
      name="keywords"
      content="The Divine Get Down, Christian encouragement, Jesus, scripture, prayer, restoration, worship, faith"
    />

    <!-- Social preview fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Divine Get Down" />
    <meta property="og:site_name" content="The Divine Get Down" />
    <meta property="og:description" content="Watch the latest videos and receive the Stillness Scroll." />
    <meta property="og:image" content="/divine_logo.png" />
    <meta property="og:image:alt" content="The Divine Get Down glowing crest" />
    <meta property="og:url" content="https://thedivinegetdown.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thedivinegetdown" />
    <meta name="twitter:title" content="The Divine Get Down" />
    <meta name="twitter:description" content="Watch the latest videos and receive the Stillness Scroll." />
    <meta name="twitter:image" content="/divine_logo.png" />

        <link rel="canonical" href="https://thedivinegetdown.com/" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" href="/divine_logo.png" />
    <link rel="apple-touch-icon" href="/divine_logo.png" />

    <!-- Preload the logo for a crisp hero reveal -->
    <link rel="preload" as="image" href="/divine_logo.png" imagesrcset="/divine_logo.png" />
  
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Divine Get Down",
        "url": "https://thedivinegetdown.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://thedivinegetdown.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <style>
      .skip-link {
        position: absolute;
        left: -999px;
        top: 0;
        background: #000;
        color: #fff;
        padding: 8px 12px;
        z-index: 10000;
      }
      .skip-link:focus {
        left: 8px;
      }
    </style>
      <script type="module" src="/src/main.jsx"></script>
</body>
</html>
