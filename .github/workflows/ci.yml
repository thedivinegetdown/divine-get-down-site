name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, build, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Run unit and rendering tests
        run: npm test -- --runInBand

      - name: Build production bundle
        run: npm run build

      - name: Run responsive browser journey checks
        run: npm run test:visual:functional

      - name: Check whitespace errors
        run: git diff --check
