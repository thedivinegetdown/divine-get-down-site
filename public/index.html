<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/divine_logo.webp" type="image/webp" fetchpriority="high" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/divine_logo.png" />


    <!-- Primary SEO (per-tab SEO is handled in React via Helmet) -->
    <title data-rh="true">Christ-Centered Videos, Prayer &amp; Encouragement | The Divine Get Down</title>
    <meta
      data-rh="true"
      name="description"
      content="Find Christ-centered videos, Scripture-rooted prayer, peaceful encouragement, and speaking services from The Divine Get Down."
    />
    
    <!-- Canonical -->
    <link data-rh="true" rel="canonical" href="https://thedivinegetdown.com/" />

    <!-- Open Graph / Facebook / Threads -->
    <meta data-rh="true" property="og:site_name" content="The Divine Get Down" />
    <meta data-rh="true" property="og:title" content="Christ-Centered Videos, Prayer &amp; Encouragement | The Divine Get Down" />
    <meta data-rh="true" property="og:description" content="Find Christ-centered videos, Scripture-rooted prayer, peaceful encouragement, and speaking services from The Divine Get Down." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://thedivinegetdown.com/" />
    <meta data-rh="true" property="og:image" content="https://thedivinegetdown.com/og-image.png" />

    <!-- Twitter / X -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Christ-Centered Videos, Prayer &amp; Encouragement | The Divine Get Down" />
    <meta data-rh="true" name="twitter:description" content="Find Christ-centered videos, Scripture-rooted prayer, peaceful encouragement, and speaking services from The Divine Get Down." />
    <meta data-rh="true" name="twitter:image" content="https://thedivinegetdown.com/og-image.png" />
    <!-- Social preview fallback -->
    <meta data-rh="true" property="og:image:alt" content="The Divine Get Down glowing crest" />


    <!-- Favicons -->
    <link rel="icon" href="/divine_logo.png" />
    <link rel="apple-touch-icon" href="/divine_logo.png" />

    <!-- Preload the logo for a crisp hero reveal -->
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <form
      name="contact-inquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <select name="inquiry-type">
        <option value="speaking-engagement">Speaking engagement</option>
        <option value="teaching-workshop">Teaching or workshop</option>
        <option value="interview-media">Interview or media appearance</option>
        <option value="faith-collaboration">Faith-based collaboration</option>
        <option value="business-partnership">Business or partnership inquiry</option>
        <option value="general-inquiry">General inquiry</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <style>
      .skip-link {
        position: absolute;
        left: -999px;
        top: 0;
        background: #000;
        color: #fff;
        padding: 8px 12px;
        z-index: 10000;
      }
      .skip-link:focus {
        left: 8px;
      }
    </style>
  </body>
</html>
