[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  HUSKY = "0"
  NODE_VERSION = "22"

# Revalidate HTML and unversioned assets, including PDFs, images, robots, and
# the sitemap, so content updates are not hidden behind long browser caches.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://googleads.g.doubleclick.net https://static.doubleclick.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

# This more-specific rule must follow the catch-all so hashed build assets keep
# their immutable browser policy while inheriting the security headers above.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

